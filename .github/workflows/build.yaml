name: build

on:
  pull_request:
    branches: ['master', 'release/**']
  push:
    branches: ['master', 'release/**']

jobs:
  path-filter:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.code }}
      should_test_smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**.h'
              - '**.hpp'
              - '**.c'
              - '**.cpp'
              - '**.cc'
              - 'po/**'
              - '**.cmake'
              - '**/CMakeLists.txt'
            smoke:
              - 'tools/test_linglong/**'
              - '.github/workflows/build.yaml'

  smoke-python-tests:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_test_smoke == 'true' }}
    name: test Python smoke-test helpers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install report dependency
        run: python3 -m pip install openpyxl==3.1.5
      - name: Run unit tests
        run: >-
          python3 -W error::ResourceWarning -m unittest discover
          -s tools/test_linglong/tests -v

  build-u24-x64:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_build == 'true' }}
    name: build on ubuntu-24.04 with Qt6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Update apt metadata
        run: sudo apt-get update
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            cmake ninja-build debhelper-compat erofs-utils erofsfuse intltool libcap-dev
            libcli11-dev libcurl4-openssl-dev libdeflate-dev libelf-dev libexpected-dev
            libfuse3-dev libglib2.0-dev libgmock-dev libgtest-dev liblz4-dev liblzma-dev
            libostree-dev libpcre2-dev libselinux1-dev libssl-dev libsystemd-dev libyaml-cpp-dev
            libzstd-dev nlohmann-json3-dev pkg-config zlib1g-dev libwayland-dev wayland-protocols libgl1-mesa-dev
            qt6-base-dev qt6-base-private-dev
          version: 1.0
      - name: Configure CMake
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCPM_LOCAL_PACKAGES_ONLY=ON -DLINGLONG_ENABLE_WAYLAND_SEC_CTX_SUPPORT=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: cmake --build build --target test

  build-u24-arm:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_build == 'true' }}
    name: build on ubuntu-24.04-arm with Qt6
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Update apt metadata
        run: sudo apt-get update
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            cmake ninja-build debhelper-compat erofs-utils erofsfuse intltool libcap-dev
            libcli11-dev libcurl4-openssl-dev libdeflate-dev libelf-dev libexpected-dev
            libfuse3-dev libglib2.0-dev libgmock-dev libgtest-dev liblz4-dev liblzma-dev
            libostree-dev libpcre2-dev libselinux1-dev libssl-dev libsystemd-dev libyaml-cpp-dev
            libzstd-dev nlohmann-json3-dev pkg-config zlib1g-dev libwayland-dev wayland-protocols libgl1-mesa-dev
            qt6-base-dev qt6-base-private-dev
          version: 1.0
      - name: Configure CMake
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCPM_LOCAL_PACKAGES_ONLY=ON -DLINGLONG_ENABLE_WAYLAND_SEC_CTX_SUPPORT=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: cmake --build build --target test

  build-u22-x64:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_build == 'true' }}
    name: build on ubuntu-22.04 with Qt5
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Update apt metadata
        run: sudo apt-get update
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            cmake ninja-build debhelper-compat erofs-utils erofsfuse intltool libcap-dev
            libcli11-dev libcurl4-openssl-dev libdeflate-dev libelf-dev libexpected-dev
            libfuse3-dev libglib2.0-dev libgmock-dev libgtest-dev liblz4-dev liblzma-dev
            libostree-dev libpcre2-dev libselinux1-dev libssl-dev libsystemd-dev libyaml-cpp-dev
            libzstd-dev nlohmann-json3-dev pkg-config zlib1g-dev libgl1-mesa-dev
            qtbase5-dev qtbase5-private-dev
          version: 1.0
      - name: Configure CMake
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCPM_LOCAL_PACKAGES_ONLY=ON -DENABLE_TESTING=OFF
      - name: Build
        run: cmake --build build --parallel

  build-u22-arm:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_build == 'true' }}
    name: build on ubuntu-22.04-arm with Qt5
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Update apt metadata
        run: sudo apt-get update
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            cmake ninja-build debhelper-compat erofs-utils erofsfuse intltool libcap-dev
            libcli11-dev libcurl4-openssl-dev libdeflate-dev libelf-dev libexpected-dev
            libfuse3-dev libglib2.0-dev libgmock-dev libgtest-dev liblz4-dev liblzma-dev
            libostree-dev libpcre2-dev libselinux1-dev libssl-dev libsystemd-dev libyaml-cpp-dev
            libzstd-dev nlohmann-json3-dev pkg-config zlib1g-dev libgl1-mesa-dev
            qtbase5-dev qtbase5-private-dev
          version: 1.0
      - name: Configure CMake
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCPM_LOCAL_PACKAGES_ONLY=ON -DENABLE_TESTING=OFF
      - name: Build
        run: cmake --build build --parallel

  build-status:
    name: Final build Status
    needs:
      [
        path-filter,
        smoke-python-tests,
        build-u24-x64,
        build-u24-arm,
        build-u22-x64,
        build-u22-arm,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide status
        run: |
          U24_X64="${{ needs.build-u24-x64.result }}"
          U24_ARM="${{ needs.build-u24-arm.result }}"
          U22_X64="${{ needs.build-u22-x64.result }}"
          U22_ARM="${{ needs.build-u22-arm.result }}"
          SMOKE_TESTS="${{ needs.smoke-python-tests.result }}"
          PATH_FILTER="${{ needs.path-filter.result }}"

          if [[ "$PATH_FILTER" != "success" ]]; then
            echo "Path filtering did not complete successfully."
            exit 1
          fi

          if [[ "$SMOKE_TESTS" != "success" && "$SMOKE_TESTS" != "skipped" ]]; then
            echo "Python smoke-test helper tests failed or were cancelled."
            exit 1
          fi

          for BUILD_RESULT in "$U24_X64" "$U24_ARM" "$U22_X64" "$U22_ARM"; do
            if [[ "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ]]; then
              echo "One or more builds failed or were cancelled."
              exit 1
            fi
          done
          echo "All builds successful or skipped."
          exit 0
