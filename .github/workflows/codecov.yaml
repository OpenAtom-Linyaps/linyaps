name: coverage

on:
  pull_request:
    branches: ['master', 'release/**']
  push:
    branches: ['master', 'release/**']

jobs:
  path-filter:
    runs-on: ubuntu-latest
    outputs:
      should_scan: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**.h'
              - '**.hpp'
              - '**.c'
              - '**.cpp'
              - '**.cc'
              - 'po/**'
              - '**.cmake'
              - '**/CMakeLists.txt'
              - '.github/workflows/**'
              - '.github/tests/**'

  codecov:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_scan == 'true' }}
    name: codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update apt metadata
        run: sudo apt-get update
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            gcovr cmake debhelper-compat erofs-utils erofsfuse intltool libcap-dev libcli11-dev
            libcurl4-openssl-dev libdeflate-dev libelf-dev libexpected-dev libfuse3-dev libglib2.0-dev libgmock-dev
            libgtest-dev liblz4-dev liblzma-dev libostree-dev libpcre2-dev libselinux1-dev libssl-dev libsystemd-dev
            libyaml-cpp-dev libzstd-dev nlohmann-json3-dev pkg-config qt6-base-dev qt6-base-private-dev systemd zlib1g-dev
            libwayland-dev wayland-protocols libgl1-mesa-dev
          version: 1.0

      - name: Generate coverage
        run: |
          ./tools/generate-coverage.sh

      - name: Upload Report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build-generate-coverage/report/index.xml
          disable_search: true
          disable_telem: true

  coverage_final_status:
    name: Coverage Check Success
    needs: [path-filter, codecov]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide Status
        run: |
          FILTER_RESULT="${{ needs.path-filter.result }}"
          SHOULD_RUN="${{ needs.path-filter.outputs.should_scan }}"
          if [[ "$FILTER_RESULT" != "success" ]]; then
            echo "Path filtering did not succeed."
            exit 1
          fi
          case "$SHOULD_RUN" in
            true) EXPECTED_RESULT="success" ;;
            false) EXPECTED_RESULT="skipped" ;;
            *) echo "Missing or invalid path-filter output."; exit 1 ;;
          esac

          RESULT="${{ needs.codecov.result }}"
          if [[ "$RESULT" != "$EXPECTED_RESULT" ]]; then
            echo "Required job result: $RESULT; expected: $EXPECTED_RESULT."
            exit 1
          fi
          echo "All required job results match the successful path filter."
