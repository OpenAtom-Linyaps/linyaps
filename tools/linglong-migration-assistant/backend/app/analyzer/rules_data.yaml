# 依赖归属规则库
# level 说明：
#   base    - 大概率由玲珑 base（org.deepin.base/23.1.0）提供，无需处理
#   runtime - 大概率由玲珑 runtime（org.deepin.runtime.dtk/23.1.0）提供，建议声明 runtime
#   bundled - 需要随应用自带（生成安装脚本收集进 $PREFIX）
#
# 匹配方式：先精确匹配 exact，再按前缀匹配 prefixes。
# 本规则库为启发式起点，欢迎按实际构建结果扩充。

base:
  exact:
    - libc6
    - libc-bin
    - libgcc-s1
    - libstdc++6
    - zlib1g
    - libbz2-1.0
    - liblzma5
    - libzstd1
    - libssl3
    - libssl3t64
    - libpcre3
    - libpcre2-8-0
    - libpcre2-16-0
    - libpcre2-32-0
    - libselinux1
    - libcom-err2
    - libkrb5-3
    - libk5crypto3
    - libkeyutils1
    - libgssapi-krb5-2
    - libidn2-0
    - libunistring2
    - libudev1
    - libsystemd0
    - systemd
    - util-linux
    - coreutils
    - bash
    - dash
    - grep
    - sed
    - gawk
    - tar
    - gzip
    - xz-utils
    - bzip2
    - file
    - findutils
    - procps
    - mount
    - dpkg
    - perl-base
    - lsb-base
    - init-system-helpers
    - multiarch-support
  prefixes:
    - libc
    - libgcc
    - libstdc++
    - libssl
    - libcrypto
    - libzstd
    - liblzma
    - libbz2
    - libpcre
    - libncurses
    - libtinfo

